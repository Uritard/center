# 下面为连接池的补充设置，应用到上面所有数据源中
spring.datasource.device.initialSize=5
spring.datasource.device.minIdle=5
spring.datasource.device.maxActive=20
# 配置获取连接等待超时的时间
spring.datasource.device.maxWait=60000
# 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
spring.datasource.device.timeBetweenEvictionRunsMillis=60000
# 配置一个连接在池中最小生存的时间，单位是毫秒
spring.datasource.device.minEvictableIdleTimeMillis=300000
spring.datasource.device.validationQuery=SELECT 1 FROM DUAL
spring.datasource.device.testWhileIdle=true
spring.datasource.device.testOnBorrow=false
spring.datasource.device.testOnReturn=false
# druid数据源监控web
spring.datasource.device.filters=config,wall,log4j,stat
spring.datasource.device.maxPoolPreparedStatementPerConnectionSize=20
spring.datasource.device.useGlobalDataSourceStat=true
spring.datasource.device.connectionProperties=druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500;config.decrypt=true
