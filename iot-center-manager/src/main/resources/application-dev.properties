#IP 配置
#本机ip
host.ip=172.24.39.9
#tomcat config
spring.application.name=iot-center-manager
server.port=18701

#注册中心
#Eureka客户端向服务端发送心跳的时间间隔，单位为秒（客户端告诉服务端自己会按照该规则）
eureka.instance.prefer-ip-address=true
eureka.instance.status-page-url=http://${host.ip}:18701/actuator/info
eureka.instance.health-check-url-path=/actuator/health

#Eureka客户端向服务端发送心跳的时间间隔，单位为秒（客户端告诉服务端自己会按照该规则）
eureka.instance.lease-renewal-interval-in-seconds =5
#Eureka服务端在收到最后一次心跳之后等待的时间上限，单位为秒，超过则剔除（客户端告诉服务端按照此规则等待自己）
eureka.instance.lease-expiration-duration-in-seconds =15

# 禁用增量拉取
# eureka.client.disable-delta=true
# eureka.client.should-filter-only-up-instances=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://${host.ip}:18701/eureka/

#zuul
zuul.host.socket-timeout-millis=10000
#网关最大超时时间10s
zuul.host.connect-timeout-millis=10000
#网关最大连接数 默认200
zuul.host.max-total-connections=200

#给要路由的API请求加前缀 可加可不加
#zuul.prefix=/v1
#需要忽略的服务 ,号分隔  配置后将不会被路由
#zuul.ignored-services=spring-cloud-ms-eureka

#这一组配置后,访问http://localhost:8001/v1/ms-member/member/showMember即相当于直接访问会员服务http://localhost:9000/member/showMember
zuul.routes.platform.serviceId=iot-center-platform
zuul.routes.platform.path=/platform/**
zuul.routes.accessrobot.serviceId=iot-center-accessrobot
zuul.routes.accessrobot.path=/accessrobot/**
zuul.routes.accessudp.serviceId=iot-center-accessudp
zuul.routes.accessudp.path=/accessudp/**

