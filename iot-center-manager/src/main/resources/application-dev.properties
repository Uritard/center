spring.datasource.manager.connectionProperties=druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500;config.decrypt=true;config.decrypt.key=${spring.datasource.manager.publicKey}
# 下面为连接池的补充设置，应用到上面所有数据源中
spring.datasource.manager.initialSize=5
spring.datasource.manager.minIdle=5
spring.datasource.manager.maxActive=20
# 配置获取连接等待超时的时间
spring.datasource.manager.maxWait=60000
# 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
spring.datasource.manager.timeBetweenEvictionRunsMillis=60000
# 配置一个连接在池中最小生存的时间，单位是毫秒
spring.datasource.manager.minEvictableIdleTimeMillis=300000
spring.datasource.manager.validationQuery=SELECT 1 FROM DUAL
spring.datasource.manager.testWhileIdle=true
spring.datasource.manager.testOnBorrow=false
spring.datasource.manager.testOnReturn=false
# druid数据源监控web
spring.datasource.manager.filters=config,wall,log4j,stat
spring.datasource.manager.maxPoolPreparedStatementPerConnectionSize=20
spring.datasource.manager.useGlobalDataSourceStat=true
