#IP 配置
#本机ip
host.ip=172.24.39.9
#tomcat config
spring.application.name=iot-center-manager
server.port=18710

#注册中心
#Eureka客户端向服务端发送心跳的时间间隔，单位为秒（客户端告诉服务端自己会按照该规则）
eureka.instance.prefer-ip-address=false
eureka.instance.status-page-url=/actuator/info
eureka.instance.health-check-url-path=/actuator/health

#Eureka客户端向服务端发送心跳的时间间隔，单位为秒（客户端告诉服务端自己会按照该规则）
eureka.instance.lease-renewal-interval-in-seconds =5
#Eureka服务端在收到最后一次心跳之后等待的时间上限，单位为秒，超过则剔除（客户端告诉服务端按照此规则等待自己）
eureka.instance.lease-expiration-duration-in-seconds =15

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.serviceUrl.defaultZone=http://${host.ip}:18710/eureka/

#mybatis 下划线自动转驼峰
mybatis.configuration.mapUnderscoreToCamelCase=true
#mybatis.configuration.map-underscore-to-camel-case=true
#DB mysql configuration:
spring.datasource.manager.driverClassName=com.mysql.jdbc.Driver
spring.datasource.manager.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.manager.url=jdbc:mysql://${host.ip}:3306/intelligenceelec?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowMultiQueries=true&serverTimezone=Asia/Shanghai&autoReconnect=true
spring.datasource.manager.username=root
#spring.datasource.manager.password=yjh@123!
spring.datasource.manager.password=HiJsiNeaQe8dPrdOHIGUIdj/yZkRphe1cZP5kyil1UjvhcXLya2/WzHMyIiJI+tKuJf1DMBaUR95SGz8Hi7NQw==
spring.datasource.manager.publicKey=MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAL19LiGbPzoLBZJvUqZoxeEeknRpuGc8aeMq9j+I/Jl79mem92wjn7NwrwmYfAziF6IaKZpDaIph64DdrfoesosCAwEAAQ==
spring.datasource.manager.connectionProperties=druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500;config.decrypt=true;config.decrypt.key=${spring.datasource.manager.publicKey}
# 下面为连接池的补充设置，应用到上面所有数据源中
spring.datasource.manager.initialSize=5
spring.datasource.manager.minIdle=5
spring.datasource.manager.maxActive=20
# 配置获取连接等待超时的时间
spring.datasource.manager.maxWait=60000
# 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
spring.datasource.manager.timeBetweenEvictionRunsMillis=60000
# 配置一个连接在池中最小生存的时间，单位是毫秒
spring.datasource.manager.minEvictableIdleTimeMillis=300000
spring.datasource.manager.validationQuery=SELECT 1 FROM DUAL
spring.datasource.manager.testWhileIdle=true
spring.datasource.manager.testOnBorrow=false
spring.datasource.manager.testOnReturn=false
# druid数据源监控web
spring.datasource.manager.filters=config,wall,log4j,stat
spring.datasource.manager.maxPoolPreparedStatementPerConnectionSize=20
spring.datasource.manager.useGlobalDataSourceStat=true

# Redis数据库索引（默认为0）
