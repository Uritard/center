spring.datasource.manager.validationQuery=SELECT 1 FROM DUAL
spring.datasource.manager.testWhileIdle=true
spring.datasource.manager.testOnBorrow=false
spring.datasource.manager.testOnReturn=false
# druid\u6570\u636E\u6E90\u76D1\u63A7web
