spring.datasource.accessvqd.timeBetweenEvictionRunsMillis=60000
# \u914D\u7F6E\u4E00\u4E2A\u8FDE\u63A5\u5728\u6C60\u4E2D\u6700\u5C0F\u751F\u5B58\u7684\u65F6\u95F4\uFF0C\u5355\u4F4D\u662F\u6BEB\u79D2
spring.datasource.accessvqd.minEvictableIdleTimeMillis=300000
spring.datasource.accessvqd.validationQuery=SELECT 1 FROM DUAL
spring.datasource.accessvqd.testWhileIdle=true
spring.datasource.accessvqd.testOnBorrow=false
spring.datasource.accessvqd.testOnReturn=false
# druid\u6570\u636E\u6E90\u76D1\u63A7web
spring.datasource.accessvqd.filters=config,wall,log4j,stat
spring.datasource.accessvqd.maxPoolPreparedStatementPerConnectionSize=20
spring.datasource.accessvqd.useGlobalDataSourceStat=true
