# \u4E0B\u9762\u4E3A\u8FDE\u63A5\u6C60\u7684\u8865\u5145\u8BBE\u7F6E\uFF0C\u5E94\u7528\u5230\u4E0A\u9762\u6240\u6709\u6570\u636E\u6E90\u4E2D
spring.datasource.accessmeter.initialSize=5
spring.datasource.accessmeter.minIdle=5
spring.datasource.accessmeter.maxActive=20
# \u914D\u7F6E\u83B7\u53D6\u8FDE\u63A5\u7B49\u5F85\u8D85\u65F6\u7684\u65F6\u95F4
spring.datasource.accessmeter.maxWait=60000
# \u914D\u7F6E\u95F4\u9694\u591A\u4E45\u624D\u8FDB\u884C\u4E00\u6B21\u68C0\u6D4B\uFF0C\u68C0\u6D4B\u9700\u8981\u5173\u95ED\u7684\u7A7A\u95F2\u8FDE\u63A5\uFF0C\u5355\u4F4D\u662F\u6BEB\u79D2
spring.datasource.accessmeter.timeBetweenEvictionRunsMillis=60000
# \u914D\u7F6E\u4E00\u4E2A\u8FDE\u63A5\u5728\u6C60\u4E2D\u6700\u5C0F\u751F\u5B58\u7684\u65F6\u95F4\uFF0C\u5355\u4F4D\u662F\u6BEB\u79D2
spring.datasource.accessmeter.minEvictableIdleTimeMillis=300000
spring.datasource.accessmeter.validationQuery=SELECT 1 FROM DUAL
spring.datasource.accessmeter.testWhileIdle=true
spring.datasource.accessmeter.testOnBorrow=false
spring.datasource.accessmeter.testOnReturn=false
# druid\u6570\u636E\u6E90\u76D1\u63A7web
spring.datasource.accessmeter.filters=config,wall,log4j,stat
spring.datasource.accessmeter.maxPoolPreparedStatementPerConnectionSize=20
spring.datasource.accessmeter.useGlobalDataSourceStat=true

#\u91C7\u96C6\u7535\u91CF\u6267\u884C\u95F4\u9694
accessmeter.collectdata.cron=0 0 */1 * * ?
