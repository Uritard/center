#tomcat config
spring.application.name=iot-center-accessmeter
server.port=18719
server.session-timeout=1800
server.tomcat.uri-encoding=utf-8
server.tomcat.max-threads=500
server.servlet.context-path=
server.servlet.path=/
server.tomcat.accessmeter-log-pattern=%t [%a] [%I] [%H-%m] %U %s %T
server.tomcat.accessmeter-log-enabled=true
#server.tomcat.basedir=../tomcat
