zuul.routes.logs.serviceId=iot-center-share
zuul.routes.logs.path=/logs/**
zuul.routes.manager.serviceId=iot-center-manager
zuul.routes.manager.path=/manager/**
zuul.routes.accessvideo.serviceId=iot-center-accessvideo
zuul.routes.accessvideo.path=/accessvideo/**
zuul.routes.accessrobot.serviceId=iot-center-accessrobot
zuul.routes.accessrobot.path=/accessrobot/**
